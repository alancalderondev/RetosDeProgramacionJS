<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Digital</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="calculadora">
        <h1>Calculadora Digital</h1>
        <div class="resultado">
            <div class="total"><span id="resultado">2</span></div>
            <span id="operacion">1+1</span>
        </div>
        <div class="teclado">
            <div class="parteIzquierda">
                <ul>
                    <li><button class="boton" id="num1">7</button></li>
                    <li><button class="boton" id="num2">8</button></li>
                    <li><button class="boton" id="num3">9</button></li>
                    <li><button class="boton" id="num4">4</button></li>
                    <li><button class="boton" id="num5">5</button></li>
                    <li><button class="boton" id="num6">6</button></li>
                    <li><button class="boton" id="num7">1</button></li>
                    <li><button class="boton" id="num8">2</button></li>
                    <li><button class="boton" id="num9">3</button></li>
                    <li><button class="boton" id="num0">0</button></li>
                    <li><button class="boton" id="numdot">.</button></li>
                </ul>
            </div>
            <div class="parteDerecha">
                <ul>
                    <li><button class="operador" id="ce">CE</button></li>
                    <li><button class="operador" id="c">C</button></li>
                    <li><button class="operador" id="dividir">/</button></li>
                    <li><button class="operador" id="multiplicar">*</button></li>
                    <li><button class="operador" id="restar">-</button></li>
                    <li><button class="operador" id="sumar">+</button></li>
                    <li><button class="operador" id="igual">=</button></li>
                </ul>
            </div>
        </div>
    </div>
    <script src="./js/script.js"></script>
</body>
</html>
